name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-38-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Install minimum-version test dependencies
        run: python -m pip install brotli==1.1.0 coloraide==3.3 fonttools==4.55.8 pillow==10.4.0 svgelements==1.9.6
      - name: Compile and discover kits on the minimum Python
        run: |
          python -m compileall -q scripts skill/templates
          python scripts/build_all.py --list
          python scripts/test_package_release.py
          python scripts/test_release_contract.py
          python scripts/test_prepare_site.py
          python scripts/test_identity_continuity_audit.py
          python skill/templates/test_brand_contract.py
          python skill/templates/test_identity_continuity.py
          python skill/templates/test_iconkit.py
          python skill/templates/test_pipeline.py
          python scripts/check_markdown.py

  approved-identity-proofs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
      - name: Install approved proof toolchain
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix skill/templates --no-save --no-package-lock @resvg/resvg-js@2.6.2
      - name: Export exact approved identity evidence
        run: python scripts/export_approved_identity_proofs.py brands/i-heart-pr-tours dist/ci-approved-proofs/i-heart-pr-tours
      - uses: actions/upload-artifact@v7
        with:
          name: approved-identity-proofs
          path: dist/ci-approved-proofs/
          if-no-files-found: error

  build:
    needs: approved-identity-proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v5
        with:
          version: 10.28.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install document renderers
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils
          npm install --prefix skill/templates --no-save --no-package-lock @resvg/resvg-js@2.6.2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install site and browser dependencies
        run: pnpm --dir site install --frozen-lockfile && pnpm --dir site exec playwright install chromium --with-deps
      - uses: actions/download-artifact@v7
        with:
          name: approved-identity-proofs
          path: approved-identity-proofs
      - name: Test geometry
        run: |
          python skill/templates/test_glyphkit.py
          python scripts/test_package_release.py
          python scripts/test_release_contract.py
          python scripts/test_prepare_site.py
          python scripts/test_identity_continuity_audit.py
          python skill/templates/test_brand_contract.py
          python skill/templates/test_identity_continuity.py
          python skill/templates/test_iconkit.py
          GP_APPROVED_PROOF_ROOT="$GITHUB_WORKSPACE/approved-identity-proofs" python skill/templates/test_pipeline.py
          python scripts/check_markdown.py
      - name: Probe capabilities
        run: python skill/templates/probe.py
      - name: Build and verify every kit
        run: python scripts/build_all.py
        env:
          GP_APPROVED_PROOF_ROOT: ${{ github.workspace }}/approved-identity-proofs
      - name: Certify release metadata and archives
        run: |
          VERSION="$(python scripts/release_contract.py current)"
          python scripts/package_release.py --version "$VERSION"
          python scripts/release_contract.py notes --version "$VERSION" --output release/release-notes.md
          python scripts/release_contract.py verify --version "$VERSION" --release-dir release --notes release/release-notes.md
      - name: Check generated agent contract
        run: |
          python skill/templates/sync_agents_md.py skill
          git diff --exit-code -- skill/AGENTS.md
      - name: Type-check and export site
        run: pnpm --dir site lint && pnpm --dir site build && pnpm --dir site test
      - uses: actions/upload-artifact@v7
        with:
          name: verified-brand-kits
          path: dist/
          if-no-files-found: error

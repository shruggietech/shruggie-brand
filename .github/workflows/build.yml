name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  python-38-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.8"
      - name: Install minimum-version test dependencies
        run: python -m pip install brotli==1.1.0 coloraide==3.3 fonttools==4.55.8 pillow==10.4.0 svgelements==1.9.6 jsonschema==4.17.3
      - name: Compile and discover kits on the minimum Python
        run: |
          python -m compileall -q scripts skill/templates
          python scripts/build_all.py --list
          python scripts/test_publication_workflow.py
          python scripts/test_package_release.py
          python scripts/test_release_contract.py
          python scripts/test_documentation_publication.py
          python scripts/test_prepare_site.py
          python scripts/test_public_documentation.py
          python scripts/test_check_readme_links.py
          python scripts/audit_public_documentation.py --sources
          python scripts/test_identity_continuity_audit.py
          python skill/templates/test_brand_contract.py
          python skill/templates/test_color_roles.py
          python skill/templates/test_interface_contract.py
          python skill/templates/test_documentation_contract.py
          python skill/templates/test_component_contract.py
          python skill/templates/test_web_react_adapter.py
          python skill/templates/test_egui_adapter.py
          python skill/templates/test_conformance.py
          python skill/templates/test_identity_continuity.py
          python skill/templates/test_iconkit.py
          python skill/templates/test_pipeline.py
          python skill/templates/test_registry_contract.py
          python scripts/check_markdown.py

  approved-identity-proofs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
      - name: Install approved proof toolchain
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix skill/templates --no-save --no-package-lock @resvg/resvg-js@2.6.2
      - name: Export exact approved identity evidence
        run: python scripts/export_approved_identity_proofs.py brands/i-heart-pr-tours dist/ci-approved-proofs/i-heart-pr-tours
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: approved-identity-proofs-${{ github.sha }}
          path: dist/ci-approved-proofs/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: failure()
        with:
          name: failed-approved-identity-proofs-${{ github.sha }}
          path: dist/ci-approved-proofs/
          if-no-files-found: warn

  verified-build:
    needs: approved-identity-proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install document renderers
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils
          npm install --prefix skill/templates --no-save --no-package-lock @resvg/resvg-js@2.6.2
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install site and browser dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: |
          pnpm --dir site install --frozen-lockfile
          python -m playwright install chromium --with-deps
          pnpm --dir site exec playwright install chromium --with-deps
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-identity-proofs-${{ github.sha }}
          path: approved-identity-proofs
      - name: Test geometry and publication contracts
        run: |
          python scripts/test_export_approved_identity_proofs.py
          python skill/templates/test_glyphkit.py
          python scripts/test_publication_workflow.py
          python scripts/test_package_release.py
          python scripts/test_release_contract.py
          python scripts/test_documentation_publication.py
          python scripts/test_prepare_site.py
          python scripts/test_public_documentation.py
          python scripts/test_check_readme_links.py
          python scripts/audit_public_documentation.py --sources
          python scripts/test_identity_continuity_audit.py
          python skill/templates/test_brand_contract.py
          python skill/templates/test_color_roles.py
          python skill/templates/test_interface_contract.py
          python skill/templates/test_documentation_contract.py
          python skill/templates/test_component_contract.py
          python skill/templates/test_web_react_adapter.py
          python skill/templates/test_egui_adapter.py
          python skill/templates/test_conformance.py
          python skill/templates/test_identity_continuity.py
          python skill/templates/test_iconkit.py
          python skill/templates/test_registry_contract.py
          GP_APPROVED_PROOF_ROOT="$GITHUB_WORKSPACE/approved-identity-proofs" python skill/templates/test_pipeline.py
          python scripts/check_markdown.py
      - name: Probe capabilities
        run: python skill/templates/probe.py
      - name: Build and verify every kit
        run: python scripts/build_all.py
        env:
          GP_APPROVED_PROOF_ROOT: ${{ github.workspace }}/approved-identity-proofs
      - name: Install generated registry items in a clean consumer
        run: python scripts/test_registry_delivery.py
      - name: Certify release metadata and archives
        run: |
          VERSION="$(python scripts/release_contract.py current)"
          python scripts/package_release.py --version "$VERSION"
          python scripts/release_contract.py notes --version "$VERSION" --output release/release-notes.md
          python scripts/release_contract.py verify --version "$VERSION" --release-dir release --notes release/release-notes.md
      - name: Check generated agent contract
        run: |
          python skill/templates/sync_agents_md.py skill
          git diff --exit-code -- skill/AGENTS.md
      - name: Type-check and export site
        run: pnpm --dir site lint && pnpm --dir site build && python scripts/check_readme_links.py && pnpm --dir site test
        env:
          GP_APPROVED_PROOF_ROOT: ${{ github.workspace }}/approved-identity-proofs
      - name: Upload human-reviewable conformance candidates
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: conformance-candidates-${{ github.sha }}
          path: site/test-results/visual/conformance/
          if-no-files-found: warn
      - name: Audit publication contents
        run: |
          python scripts/test_registry_delivery.py --site site/out --inventory-only
          python scripts/audit_public_documentation.py --prepared
          python scripts/audit_publication_artifacts.py --kits dist --site site/out
      - name: Stage checksummed release candidate
        run: |
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          VERSION="$(python scripts/release_contract.py current)"
          mkdir -p "$CANDIDATE/files"
          cp release/*.skill release/*.zip release/release-notes.md "$CANDIDATE/files/"
          cp site/generated/publication.json "$CANDIDATE/PUBLICATION.json"
          cp site/generated/documentation-publication.json "$CANDIDATE/DOCUMENTATION.json"
          cp site/out/docs/publication.json "$CANDIDATE/SITE-DOCUMENTATION.json"
          cp -R site/generated/docs "$CANDIDATE/docs"
          printf '%s\n' "$GITHUB_SHA" > "$CANDIDATE/SOURCE_COMMIT"
          (cd "$CANDIDATE/files" && sha256sum -- ./*.skill ./*.zip | sort -k2) > "$CANDIDATE/SHA256SUMS"
          (cd "$CANDIDATE/files" && sha256sum --check ../SHA256SUMS)
          python scripts/release_contract.py documentation --version "$VERSION" --record "$CANDIDATE/DOCUMENTATION.json" --publication "$CANDIDATE/PUBLICATION.json" --docs "$CANDIDATE/docs" --exported "$CANDIDATE/SITE-DOCUMENTATION.json" --release-dir "$CANDIDATE/files" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: verified-brand-kits-${{ github.sha }}
          path: |
            dist/covarity/
            dist/cueson/
            dist/eso-weave/
            dist/fragcap/
            dist/glitchpad/
            dist/go-schedule/
            dist/i-heart-pr-tours/
            dist/shruggietech/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.sha }}
          path: site/out
          include-hidden-files: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: verified-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error

  build:
    if: ${{ always() }}
    needs: [python-38-compatibility, approved-identity-proofs, verified-build]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce successful authoritative verification
        env:
          PYTHON_RESULT: ${{ needs.python-38-compatibility.result }}
          PROOF_RESULT: ${{ needs.approved-identity-proofs.result }}
          VERIFIED_RESULT: ${{ needs.verified-build.result }}
        run: |
          if [ "$PYTHON_RESULT" != success ] || [ "$PROOF_RESULT" != success ] || [ "$VERIFIED_RESULT" != success ]; then
            echo "authoritative verification failed: python=$PYTHON_RESULT proofs=$PROOF_RESULT verified=$VERIFIED_RESULT"
            exit 1
          fi

  deploy-pages:
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.publish-release.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    needs: [build, verified-build, publish-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.sha }}

  release-preflight:
    if: >-
      ${{
        needs.build.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    needs: [build, verified-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify release provenance, contract, and main ancestry
        run: |
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          VERSION="$(python scripts/release_contract.py current)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(cat "$CANDIDATE/SOURCE_COMMIT")" = "$GITHUB_SHA"
          python scripts/release_contract.py publication --version "$VERSION" --record "$CANDIDATE/PUBLICATION.json" --revision "$GITHUB_SHA" --require-release
          python scripts/release_contract.py documentation --version "$VERSION" --record "$CANDIDATE/DOCUMENTATION.json" --publication "$CANDIDATE/PUBLICATION.json" --docs "$CANDIDATE/docs" --exported "$CANDIDATE/SITE-DOCUMENTATION.json" --release-dir "$CANDIDATE/files" --revision "$GITHUB_SHA" --require-release
          (cd "$CANDIDATE/files" && sha256sum --check ../SHA256SUMS)
          python scripts/release_contract.py verify --version "$VERSION" --release-dir "$CANDIDATE/files" --notes "$CANDIDATE/files/release-notes.md" --revision "$GITHUB_SHA" --require-release
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish-release:
    if: >-
      ${{
        needs.release-preflight.result == 'success' &&
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    needs: [build, release-preflight]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate
      - name: Recheck transport and publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          test "$(cat "$CANDIDATE/SOURCE_COMMIT")" = "$GITHUB_SHA"
          (cd "$CANDIDATE/files" && sha256sum --check ../SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$CANDIDATE"/files/*.skill "$CANDIDATE"/files/*.zip "$CANDIDATE/SHA256SUMS" \
            --verify-tag \
            --title "shruggie-brandbuilder ${GITHUB_REF_NAME#v}" \
            --notes-file "$CANDIDATE/files/release-notes.md"

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderers and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick poppler-utils
          python -m pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Rebuild verified kits and release archives
        run: |
          python skill/templates/test_glyphkit.py
          python scripts/test_release_contract.py
          python skill/templates/test_pipeline.py
          python scripts/check_markdown.py
          python scripts/build_all.py
          python scripts/package_release.py --version "${GITHUB_REF_NAME#v}"
          python scripts/release_contract.py notes --version "${GITHUB_REF_NAME#v}" --output release/release-notes.md
          python scripts/release_contract.py verify --version "${GITHUB_REF_NAME#v}" --release-dir release --notes release/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.skill release/*.zip \
            --title "shruggie-brandbuilder ${GITHUB_REF_NAME#v}" \
            --notes-file release/release-notes.md

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Favicon Demo</title>
    <meta name="description" content="A favicon demo page for testing out local brand assets">
    <meta name="keywords" content="favicon, favicons, favicon demo page">

    <!-- ****** FAVICONS AND BRANDING ****** -->
    <!-- Standard favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">

    <!-- Android/Chrome icons (legacy sizes still commonly used) -->
    <link rel="icon" type="image/png" sizes="36x36" href="android-icon-36x36.png">
    <link rel="icon" type="image/png" sizes="48x48" href="android-icon-48x48.png">
    <link rel="icon" type="image/png" sizes="72x72" href="android-icon-72x72.png">
    <link rel="icon" type="image/png" sizes="96x96" href="android-icon-96x96.png">
    <link rel="icon" type="image/png" sizes="144x144" href="android-icon-144x144.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-icon-192x192.png">

    <!-- Apple touch icons -->
    <link rel="apple-touch-icon" sizes="57x57" href="apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-icon-180x180.png">
    <!-- Some generators include these generic names -->
    <link rel="apple-touch-icon" href="apple-icon.png">
    <link rel="apple-touch-icon-precomposed" href="apple-icon-precomposed.png">

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <!-- Windows tiles -->
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="ms-icon-144x144.png">
    <meta name="msapplication-config" content="browserconfig.xml">

    <!-- Mobile web app hints -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="I ❤️ PR Tours">

    <!-- ****** CSS STYLE DATA ****** -->
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Fancybox -->
    <link href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4/dist/fancybox.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@4/dist/fancybox.umd.js"></script>
    <script id="gallery-config" type="application/json">[
        "android-icon-36x36.png",
        "android-icon-48x48.png",
        "android-icon-72x72.png",
        "android-icon-96x96.png",
        "android-icon-144x144.png",
        "android-icon-192x192.png",
        "apple-icon-57x57.png",
        "apple-icon-60x60.png",
        "apple-icon-72x72.png",
        "apple-icon-76x76.png",
        "apple-icon-114x114.png",
        "apple-icon-120x120.png",
        "apple-icon-144x144.png",
        "apple-icon-152x152.png",
        "apple-icon-180x180.png",
        "apple-icon.png",
        "apple-icon-precomposed.png",
        "favicon-16x16.png",
        "favicon-32x32.png",
        "favicon-96x96.png",
        "favicon.ico",
        "ms-icon-70x70.png",
        "ms-icon-144x144.png",
        "ms-icon-150x150.png",
        "ms-icon-310x310.png"
    ]</script>
    <!-- Custom CSS -->
    <style>
        :root { --gutter: 16px; }

        .grid {
            margin-left: auto;
            margin-right: auto;
        }
        /* Base: single column */
        .grid-sizer,
        .grid-item {
            width: 100%;
        }
        .gutter-sizer { width: var(--gutter); }
        .grid-item { margin-bottom: var(--gutter); }

        /* Breakpoints for columns */
        @media (min-width: 576px) {
            .grid-sizer, .grid-item { width: calc(50% - (var(--gutter) / 2)); }
        }
        @media (min-width: 992px) {
            .grid-sizer, .grid-item { width: calc(33.3333% - (2 * var(--gutter) / 3)); }
        }
        @media (min-width: 1200px) {
            .grid-sizer, .grid-item { width: calc(25% - (3 * var(--gutter) / 4)); }
        }

        /* Card styling */
        .grid-item .card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }
        .grid-item img {
            display: block;
            width: 100%;
            height: auto;
            background: #fafafa;
        }
        .grid-item .card-body {
            font-family: Ubuntu, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }
    </style>
</head>
<body>

    <main class="container py-4">
        <h1 class="h3 mb-3">Favicon Assets Gallery</h1>
        <p class="text-muted">Responsive Masonry grid with Fancybox. Resize the window to see cards reflow.</p>

        <div class="grid">
            <div class="grid-sizer"></div>
            <div class="gutter-sizer"></div>
            <!-- Cards injected by JavaScript -->
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- imagesLoaded and Masonry JS -->
    <script src="https://cdn.jsdelivr.net/npm/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <!-- Custom Javascript code -->
     <script>
        (function () {
            const ConfigEl = document.getElementById('gallery-config');
            if (!ConfigEl) return;

            function parseConfig(el) {
                try { return JSON.parse(el.textContent || '[]'); }
                catch (e) { console.error('Invalid gallery-config JSON', e); return []; }
            }

            const Files = parseConfig(ConfigEl);
            const Grid = document.querySelector('.grid');
            if (!Grid || !Array.isArray(Files)) return;

            function createCard(fileName) {
                const Item = document.createElement('div');
                Item.className = 'grid-item';
                const Esc = String(fileName).replace(/"/g, '&quot;');
                Item.innerHTML = `
                    <div class="card shadow-sm">
                        <a href="${Esc}" data-fancybox="gallery" data-caption="${Esc}">
                            <img src="${Esc}" class="card-img-top" alt="${Esc}">
                        </a>
                        <div class="card-body p-2">
                            <small class="text-muted">${Esc}</small>
                        </div>
                    </div>`;
                return Item;
            }

            Files.forEach(f => {
                if (!/\.(png|jpe?g|webp|gif|ico|svg)$/i.test(f)) return;
                Grid.appendChild(createCard(f));
            });

            const msnry = new Masonry(Grid, {
                itemSelector: '.grid-item',
                columnWidth: '.grid-sizer',
                gutter: '.gutter-sizer',
                percentPosition: true
            });

            imagesLoaded(Grid).on('progress', function () { msnry.layout(); });
            window.addEventListener('resize', () => msnry.layout());

            if (window.Fancybox && typeof Fancybox.bind === 'function') {
                Fancybox.bind('[data-fancybox="gallery"]', { Thumbs: { autoStart: true } });
            }
        })();
    </script>
</body>

</html>
